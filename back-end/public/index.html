<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek Tolls Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map {
            height: 90vh;
            width: 100%;
        }
        #filter-container {
            padding: 10px;
            background-color: #f9f9f9;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        select {
            padding: 5px 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="filter-container">
        <label for="company-filter">Προβολή ανά εταιρεία:</label>
        <select id="company-filter">
            <option value="ALL">Όλες οι εταιρείες</option>
            <option value="AM">Εθνική Οδός (Aegean Motoray)</option>
            <option value="EG">Εγνατία Οδός</option>
            <option value="KO">Κεντρική Οδός</option>
            <option value="MO">Μορέας</option>
            <option value="NAO">Νέα Αττική Οδός</option>
            <option value="NO">Νέα Οδός</option>
            <option value="OO">Ολυμπία Οδός</option>
        </select>
    </div>
    <div id="map"></div>
    <script src="app.js"></script>
</body>
</html>
